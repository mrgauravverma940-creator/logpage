<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;

      /* Layer 1: small "GLA University" text repeated everywhere */
      /* Layer 2: colorful gradient behind it */
      background-image:
        url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='90'><text x='15' y='55' font-family='Arial' font-size='14' font-weight='bold' fill='white' fill-opacity='0.6' transform='rotate(-20 85 45)'>GLA University</text></svg>"),
        linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1, #84fab0, #8fd3f4);
      background-repeat: repeat, no-repeat;
      background-size: auto, cover;
    }
    table {
      background-color: #ffffff;
      border: 2px solid #333;
      border-collapse: collapse;
      width: 340px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }
    th, td {
      padding: 12px;
      border: 1px solid #999;
    }
    th {
      background-color: #2c3e50;
      color: #ffffff;
      font-size: 20px;
    }
    td.label {
      width: 35%;
      font-weight: bold;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    input[type="submit"], input[type="reset"] {
      padding: 8px 18px;
      cursor: pointer;
    }
    .center { text-align: center; }
  </style>
</head>
<body>

  <form id="loginForm">
    <table>
      <!-- Heading -->
      <tr>
        <th colspan="2">Login</th>
      </tr>

      <!-- Username -->
      <tr>
        <td class="label"><label for="username">Username</label></td>
        <td><input type="text" id="username" name="username" placeholder="Enter username" required></td>
      </tr>

      <!-- Password -->
      <tr>
        <td class="label"><label for="password">Password</label></td>
        <td><input type="password" id="password" name="password" placeholder="Enter password" required></td>
      </tr>

      <!-- Remember me -->
      <tr>
        <td colspan="2"><input type="checkbox" id="remember" name="remember"> <label for="remember">Remember me</label></td>
      </tr>

      <!-- Buttons -->
      <tr>
        <td colspan="2" class="center">
          <input type="submit" value="Login">
          <input type="reset" value="Reset">
        </td>
      </tr>

      <!-- Link -->
      <tr>
        <td colspan="2" class="center"><a href="#">Forgot password?</a></td>
      </tr>
    </table>
  </form>

</body>
</html>
