
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LogPage</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #e9d5ff, #fce7f3);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      color: #4338ca;
      margin-top: 0;
    }

    p {
      text-align: center;
      color: #555;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    a {
      color: #4338ca;
    }

    .links {
      margin-top: 18px;
      text-align: center;
      line-height: 2;
    }

    #message {
      margin-top: 15px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>LogPage Login</h1>
    <p>Login to your account</p>

    <form id="loginForm">
      <label for="email">Email / Gmail</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">Login</button>
    </form>

    <div class="links">
      <a href="#" id="forgotPassword">Forgot Password?</a>
      <br>
      Don't have an account?
      <a href="register.html">Register here</a>
    </div>

    <p id="message" role="status" aria-live="polite"></p>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      sendEmailVerification,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_UIQf1nKgHDfOrdmJwJ3f4zUnr11MBCk",
      authDomain: "logpage-b5d48.firebaseapp.com",
      projectId: "logpage-b5d48",
      storageBucket: "logpage-b5d48.firebasestorage.app",
      messagingSenderId: "1036796191778",
      appId: "1:1036796191778:web:66dbb4aae131310e22167b",
      measurementId: "G-17VKE891SF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const forgotPassword = document.getElementById("forgotPassword");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      loginButton.disabled = true;
      message.textContent = "Please wait...";
      message.style.color = "#555";

      try {
        const result = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        const user = result.user;

        // Refresh the user's verification status.
        await user.reload();

        if (!user.emailVerified) {
          try {
            await sendEmailVerification(user);

            message.textContent =
              "Your email is not verified. A verification link has been sent. Check your inbox and spam folder.";
          } catch (emailError) {
            message.textContent =
              "Your email is not verified. Please check your inbox or try again later.";
          }

          await signOut(auth);
          return;
        }

        message.textContent = "Login successful! Opening your page...";
        window.location.href = "welcome.html";

      } catch (error) {
        console.error(error);

        if (error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found") {
          message.textContent = "Incorrect email or password.";
        } else if (error.code === "auth/too-many-requests") {
          message.textContent =
            "Too many attempts. Please try again later.";
        } else {
          message.textContent =
            "Login failed: " + error.message;
        }
      } finally {
        loginButton.disabled = false;
      }
    });

    forgotPassword.addEventListener("click", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        message.textContent =
          "Please enter your registered email in the Email field first.";
        emailInput.focus();
        return;
      }

      forgotPassword.style.pointerEvents = "none";
      message.textContent = "Sending password reset link...";

      try {
        await sendPasswordResetEmail(auth, email);

        message.textContent =
          "If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder.";

      } catch (error) {
        console.error(error);

        if (error.code === "auth/invalid-email") {
          message.textContent = "Please enter a valid email address.";
        } else {
          message.textContent =
            "Could not send the reset email. Please check your email and try again.";
        }
      } finally {
        forgotPassword.style.pointerEvents = "auto";
      }
    });
  </script>
</body>
</html>
