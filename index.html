
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
      box-sizing: border-box;

      /* Original GLA University watermark and gradient */
      background-image:
        url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='90'><text x='15' y='55' font-family='Arial' font-size='14' font-weight='bold' fill='white' fill-opacity='0.6' transform='rotate(-20 85 45)'>GLA University</text></svg>"),
        linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1, #84fab0, #8fd3f4);
      background-repeat: repeat, no-repeat;
      background-size: auto, cover;
      background-attachment: fixed;
    }

    table {
      background-color: #ffffff;
      border: 2px solid #333;
      border-collapse: collapse;
      width: 340px;
      max-width: 94vw;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    th, td {
      padding: 12px;
      border: 1px solid #999;
    }

    th {
      background-color: #2c3e50;
      color: #ffffff;
      font-size: 20px;
    }

    td.label {
      width: 35%;
      font-weight: bold;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    input[type="submit"],
    input[type="reset"],
    button {
      padding: 8px 18px;
      cursor: pointer;
    }

    button:disabled,
    input[type="submit"]:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .center {
      text-align: center;
    }

    a {
      color: blue;
    }

    #message {
      overflow-wrap: anywhere;
      margin: 4px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <form id="loginForm">
    <table>
      <tr>
        <th colspan="2">Login</th>
      </tr>

      <tr>
        <td class="label">
          <label for="email">Email</label>
        </td>
        <td>
          <input type="email" id="email" name="email"
                 placeholder="Enter registered email"
                 autocomplete="email" required>
        </td>
      </tr>

      <tr>
        <td class="label">
          <label for="password">Password</label>
        </td>
        <td>
          <input type="password" id="password" name="password"
                 placeholder="Enter password"
                 autocomplete="current-password" required>
        </td>
      </tr>

      <tr>
        <td colspan="2">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember me</label>
        </td>
      </tr>

      <tr>
        <td colspan="2" class="center">
          <input type="submit" id="loginButton" value="Login">
          <input type="reset" value="Reset">
        </td>
      </tr>

      <tr>
        <td colspan="2" class="center">
          <a href="#" id="forgotPassword">Forgot Password?</a>
        </td>
      </tr>

      <tr>
        <td colspan="2" class="center">
          Don't have an account?
          <a href="register.html">Register here</a>
        </td>
      </tr>

      <tr>
        <td colspan="2" class="center">
          <p id="message" role="status" aria-live="polite"></p>
        </td>
      </tr>
    </table>
  </form>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      sendEmailVerification,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_UIQf1nKgHDfOrdmJwJ3f4zUnr11MBCk",
      authDomain: "logpage-b5d48.firebaseapp.com",
      projectId: "logpage-b5d48",
      storageBucket: "logpage-b5d48.firebasestorage.app",
      messagingSenderId: "1036796191778",
      appId: "1:1036796191778:web:66dbb4aae131310e22167b",
      measurementId: "G-17VKE891SF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const forgotPassword = document.getElementById("forgotPassword");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      loginButton.disabled = true;
      message.style.color = "#333";
      message.textContent = "Please wait...";

      try {
        const result = await signInWithEmailAndPassword(
          auth, email, password
        );

        const user = result.user;

        // Refresh the latest email verification status.
        await user.reload();

        if (!auth.currentUser.emailVerified) {
          try {
            await sendEmailVerification(auth.currentUser);

            message.textContent =
              "Email not verified. A verification link has been sent. " +
              "Check your inbox and spam folder.";
          } catch (verificationError) {
            console.error(verificationError);

            message.textContent =
              "Email not verified. Open your verification email, " +
              "or try again later.";
          }

          await signOut(auth);
          return;
        }

        message.style.color = "green";
        message.textContent = "Login successful!";

        window.location.href = "welcome.html";

      } catch (error) {
        console.error("Login error:", error.code);

        message.style.color = "red";

        if (error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found") {
          message.textContent = "Incorrect email or password.";
        } else if (error.code === "auth/too-many-requests") {
          message.textContent =
            "Too many attempts. Please try again later.";
        } else {
          message.textContent =
            "Login failed. Please check your details and try again.";
        }
      } finally {
        loginButton.disabled = false;
      }
    });

    forgotPassword.addEventListener("click", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        message.style.color = "red";
        message.textContent =
          "Enter your registered email in the Email field first.";
        emailInput.focus();
        return;
      }

      message.style.color = "#333";
      message.textContent = "Sending password reset link...";

      try {
        await sendPasswordResetEmail(auth, email);

        message.style.color = "green";
        message.textContent =
          "If an account exists for this email, a reset link has been sent. " +
          "Check your inbox and spam folder.";

      } catch (error) {
        console.error("Password reset error:", error.code);

        message.style.color = "red";

        if (error.code === "auth/invalid-email") {
          message.textContent = "Please enter a valid email address.";
        } else {
          message.textContent =
            "Could not send reset email. Please try again later.";
        }
      }
    });
  </script>
</body>
</html>
