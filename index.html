
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 20px 0;
      display: flex; justify-content: center; align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#ff9a9e,#fad0c4,#a18cd1,#84fab0,#8fd3f4);
    }
    table {
      width: 380px; max-width: 94vw; background: white;
      border: 2px solid #333; border-collapse: collapse;
      box-shadow: 0 5px 15px #0004;
    }
    th { padding: 15px; color: white; background: #2c3e50; font-size: 22px; }
    td { padding: 10px; border: 1px solid #ddd; }
    td:first-child { width: 35%; }
    input[type="email"], input[type="password"] {
      width: 100%; min-width: 0; padding: 10px;
      border: 1px solid #aaa; border-radius: 5px; font-size: 16px;
    }
    input[type="checkbox"] { margin-right: 6px; }
    button {
      padding: 10px 18px; border: none; border-radius: 5px;
      background: #2c3e50; color: white; font-size: 16px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    a { color: #174ea6; }
    #message { padding: 10px; text-align: center; overflow-wrap: anywhere; }
    .links { text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
<table>
  <tr><th colspan="2">Login</th></tr>
  <tr>
    <td><label for="email">Email</label></td>
    <td><input type="email" id="email" autocomplete="username"
      placeholder="Enter registered email" required></td>
  </tr>
  <tr>
    <td><label for="password">Password</label></td>
    <td><input type="password" id="password" autocomplete="current-password"
      placeholder="Enter password" required></td>
  </tr>
  <tr><td colspan="2">
    <label><input type="checkbox" id="remember"> Remember me</label>
  </td></tr>
  <tr><td colspan="2" style="text-align:center">
    <button type="button" id="loginBtn">Login</button>
  </td></tr>
  <tr><td colspan="2" class="links">
    <a href="#" id="forgotLink">Forgot Password?</a><br><br>
    Don't have an account? <a href="register.html">Register here</a>
  </td></tr>
  <tr><td colspan="2" id="message" aria-live="polite"></td></tr>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, sendPasswordResetEmail,
  setPersistence, browserLocalPersistence, browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_UIQf1nKgHDfOrdmJwJ3f4zUnr11MBCk",
  authDomain: "logpage-b5d48.firebaseapp.com",
  projectId: "logpage-b5d48",
  storageBucket: "logpage-b5d48.firebasestorage.app",
  messagingSenderId: "1036796191778",
  appId: "1:1036796191778:web:66dbb4aae131310e22167b",
  measurementId: "G-17VKE891SF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const rememberInput = document.getElementById("remember");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");

function showMessage(text, color = "#222") {
  message.textContent = text;
  message.style.color = color;
}

loginBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !emailInput.checkValidity()) {
    showMessage("Enter a valid email address.", "red");
    emailInput.focus();
    return;
  }
  if (!password) {
    showMessage("Enter your password.", "red");
    passwordInput.focus();
    return;
  }

  loginBtn.disabled = true;
  showMessage("Please wait...");

  try {
    await setPersistence(
      auth,
      rememberInput.checked ? browserLocalPersistence : browserSessionPersistence
    );
    await signInWithEmailAndPassword(auth, email, password);
    showMessage("Login successful!", "green");
    window.location.href = "welcome.html";
  } catch (error) {
    const errors = {
      "auth/invalid-credential": "Incorrect email or password.",
      "auth/user-not-found": "Incorrect email or password.",
      "auth/wrong-password": "Incorrect email or password.",
      "auth/invalid-email": "Enter a valid email address.",
      "auth/too-many-requests": "Too many attempts. Try again later.",
      "auth/network-request-failed": "Network error. Check your internet."
    };
    showMessage(errors[error.code] || "Login failed. Please try again.", "red");
  } finally {
    loginBtn.disabled = false;
  }
});

document.getElementById("forgotLink").addEventListener("click", async (event) => {
  event.preventDefault();
  const email = emailInput.value.trim();

  if (!email || !emailInput.checkValidity()) {
    showMessage("Enter your registered email first.", "red");
    emailInput.focus();
    return;
  }

  try {
    showMessage("Sending password reset email...");
    await sendPasswordResetEmail(auth, email);
    showMessage("If an account exists for this email, a reset link will be sent.", "green");
  } catch (error) {
    const errors = {
      "auth/invalid-email": "Enter a valid email address.",
      "auth/too-many-requests": "Too many attempts. Try again later.",
      "auth/network-request-failed": "Network error. Check your internet."
    };
    showMessage(errors[error.code] || "Could not send reset email. Check the email and try again.", "red");
  }
});
</script>
</body>
</html>
