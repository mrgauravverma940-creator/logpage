```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-image: linear-gradient(
        135deg,
        #ff9a9e,
        #fad0c4,
        #a18cd1,
        #84fab0,
        #8fd3f4
      );
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }

    table {
      width: 340px;
      max-width: 94vw;
      background: white;
      border: 2px solid #333;
      border-collapse: collapse;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
    }

    th {
      padding: 15px;
      color: white;
      background: #2c3e50;
      font-size: 22px;
    }

    td {
      padding: 10px;
      border: 1px solid #ddd;
    }

    td:first-child {
      width: 35%;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      min-width: 0;
      padding: 9px;
      border: 1px solid #aaa;
      border-radius: 4px;
    }

    input[type="checkbox"] {
      margin-right: 5px;
    }

    button {
      padding: 9px 14px;
      border: none;
      border-radius: 4px;
      background: #2c3e50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1a252f;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    a {
      color: #174ea6;
    }

    #message {
      padding: 10px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .links {
      text-align: center;
    }

    @media (max-width: 380px) {
      table {
        width: 94vw;
      }

      td {
        padding: 7px;
      }
    }
  </style>
</head>

<body>
  <table>
    <tr>
      <th colspan="2">Login</th>
    </tr>

    <tr>
      <td><label for="rollNumber">Roll Number</label></td>
      <td>
        <input
          type="text"
          id="rollNumber"
          inputmode="numeric"
          autocomplete="username"
          placeholder="Enter roll number"
          pattern="[0-9]+"
          required
        >
      </td>
    </tr>

    <tr>
      <td><label for="password">Password</label></td>
      <td>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
        >
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <label>
          <input type="checkbox" id="remember">
          Remember me
        </label>
      </td>
    </tr>

    <tr>
      <td colspan="2" style="text-align:center">
        <button type="button" id="loginBtn">Login</button>
        <button type="button" id="resetBtn">Reset</button>
      </td>
    </tr>

    <tr>
      <td colspan="2" class="links">
        <a href="#" id="forgotLink">Forgot Password?</a>
        <br><br>
        Don't have an account?
        <a href="register.html">Register here</a>
      </td>
    </tr>

    <tr>
      <td colspan="2" id="message" aria-live="polite"></td>
    </tr>
  </table>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      sendEmailVerification,
      signOut,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      reload
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "logpage-b5d48.firebaseapp.com",
      projectId: "logpage-b5d48",
      storageBucket: "logpage-b5d48.firebasestorage.app",
      messagingSenderId: "1036796191778",
      appId: "1:1036796191778:web:66dbb4aae131310e22167b",
      measurementId: "G-17VKE891SF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const rollInput = document.getElementById("rollNumber");
    const passwordInput = document.getElementById("password");
    const rememberInput = document.getElementById("remember");
    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");

    function showMessage(text, color = "#222") {
      message.textContent = text;
      message.style.color = color;
    }

    async function findEmailByRollNumber(rollNumber) {
      const usersRef = collection(db, "users");
      const rollQuery = query(
        usersRef,
        where("rollNumber", "==", rollNumber)
      );

      const result = await getDocs(rollQuery);

      if (result.empty) {
        return null;
      }

      if (result.size > 1) {
        throw new Error(
          "This roll number is linked to multiple accounts. Contact the administrator."
        );
      }

      return result.docs[0].data().email || null;
    }

    loginBtn.addEventListener("click", async () => {
      const rollNumber = rollInput.value.trim();
      const password = passwordInput.value;

      if (!/^[0-9]+$/.test(rollNumber)) {
        showMessage("Please enter a valid numeric roll number.", "red");
        rollInput.focus();
        return;
      }

      if (!password) {
        showMessage("Please enter your password.", "red");
        passwordInput.focus();
        return;
      }

      loginBtn.disabled = true;
      showMessage("Please wait...");

      try {
        await setPersistence(
          auth,
          rememberInput.checked
            ? browserLocalPersistence
            : browserSessionPersistence
        );

        const email = await findEmailByRollNumber(rollNumber);

        if (!email) {
          showMessage(
            "No account found for this roll number. Please check it or register first.",
            "red"
          );
          return;
        }

        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        await reload(credential.user);

        if (!credential.user.emailVerified) {
          try {
            await sendEmailVerification(credential.user);
          } catch (error) {
            // A verification email may already have been sent.
          }

          await signOut(auth);

          showMessage(
            "Your email is not verified. Check your email verification link, then log in again.",
            "red"
          );
          return;
        }

        showMessage("Login successful!", "green");
        window.location.href = "welcome.html";

      } catch (error) {
        const messages = {
          "auth/invalid-credential":
            "Incorrect roll number or password.",
          "auth/user-not-found":
            "Incorrect roll number or password.",
          "auth/wrong-password":
            "Incorrect roll number or password.",
          "auth/too-many-requests":
            "Too many attempts. Please try again later.",
          "auth/network-request-failed":
            "Network error. Check your internet.",
          "permission-denied":
            "Database permission denied. Check your Firestore security rules."
        };

        showMessage(
          messages[error.code] ||
          error.message ||
          "Login failed. Please try again.",
          "red"
        );
      } finally {
        loginBtn.disabled = false;
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      rollInput.value = "";
      passwordInput.value = "";
      rememberInput.checked = false;
      showMessage("");
    });

    document.getElementById("forgotLink").addEventListener(
      "click",
      async (event) => {
        event.preventDefault();

        const rollNumber = rollInput.value.trim();

        if (!/^[0-9]+$/.test(rollNumber)) {
          showMessage(
            "Enter your numeric roll number first.",
            "red"
          );
          rollInput.focus();
          return;
        }

        try {
          showMessage("Finding your registered account...");

          const email = await findEmailByRollNumber(rollNumber);

          if (!email) {
            showMessage(
              "No account found for this roll number.",
              "red"
            );
            return;
          }

          await sendPasswordResetEmail(auth, email);

          showMessage(
            "If your account exists, a password reset link has been sent to its registered email. Check your inbox and spam folder.",
            "green"
          );

        } catch (error) {
          showMessage(
            error.message ||
            "Could not send the reset email. Please try again later.",
            "red"
          );
        }
      }
    );
  </script>
</body>
</html>
