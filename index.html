
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-image:
        url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='90'><text x='15' y='55' font-family='Arial' font-size='14' font-weight='bold' fill='white' fill-opacity='0.6' transform='rotate(-20 85 45)'>GLA University</text></svg>"),
        linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1, #84fab0, #8fd3f4);
      background-repeat: repeat, no-repeat;
      background-size: auto, cover;
      background-attachment: fixed;
    }

    table {
      background-color: #fff;
      border: 2px solid #333;
      border-collapse: collapse;
      width: 340px;
      max-width: 95vw;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    th, td {
      padding: 12px;
      border: 1px solid #999;
    }

    th {
      background-color: #2c3e50;
      color: #fff;
      font-size: 20px;
    }

    td.label {
      width: 35%;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    input[type="submit"],
    input[type="reset"] {
      padding: 8px 18px;
      cursor: pointer;
    }

    .center {
      text-align: center;
    }

    #message {
      margin: 12px;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <form id="loginForm">
    <table>
      <tr>
        <th colspan="2">Login</th>
      </tr>

      <tr>
        <td class="label">
          <label for="email">Email</label>
        </td>
        <td>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter registered email"
            autocomplete="username"
            required
          >
        </td>
      </tr>

      <tr>
        <td class="label">
          <label for="password">Password</label>
        </td>
        <td>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >
        </td>
      </tr>

      <tr>
        <td colspan="2">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember me</label>
        </td>
      </tr>

      <tr>
        <td colspan="2" class="center">
          <input type="submit" value="Login" id="loginButton">
          <input type="reset" value="Reset">
        </td>
      </tr>

      <tr>
        <td colspan="2" class="center">
          <a href="#" id="forgotPassword">Forgot password?</a>
        </td>
      </tr>

      <tr>
        <td colspan="2" class="center">
          <p id="message" role="status" aria-live="polite"></p>
        </td>
      </tr>
    </table>
  </form>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    // Your Firebase project configuration
    const firebaseConfig = {
      apiKey: "AIzaSyB_UIQf1nKgHDfOrdmJwJ3f4zUnr11MBCk",
      authDomain: "logpage-b5d48.firebaseapp.com",
      projectId: "logpage-b5d48",
      storageBucket: "logpage-b5d48.firebasestorage.app",
      messagingSenderId: "1036796191778",
      appId: "1:1036796191778:web:66dbb4aae131310e22167b",
      measurementId: "G-17VKE891SF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const forgotPassword = document.getElementById("forgotPassword");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const remember = document.getElementById("remember").checked;

      loginButton.disabled = true;
      message.textContent = "Logging in...";

      try {
        await setPersistence(
          auth,
          remember ? browserLocalPersistence : browserSessionPersistence
        );

        await signInWithEmailAndPassword(auth, email, password);

        message.textContent = "Login successful!";

        // welcome.html must exist in your GitHub repository.
        window.location.href = "welcome.html";
      } catch (error) {
        console.error("Login error:", error.code);

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/user-not-found" ||
          error.code === "auth/wrong-password"
        ) {
          message.textContent = "Incorrect email or password.";
        } else if (error.code === "auth/invalid-email") {
          message.textContent = "Please enter a valid email address.";
        } else if (error.code === "auth/too-many-requests") {
          message.textContent =
            "Too many attempts. Please try again later.";
        } else {
          message.textContent =
            "Login failed. Please check your Firebase settings and try again.";
        }
      } finally {
        loginButton.disabled = false;
      }
    });

    forgotPassword.addEventListener("click", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      if (!email) {
        message.textContent =
          "Please enter your registered email first.";
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        message.textContent =
          "If the account exists, a password reset email has been sent.";
      } catch (error) {
        console.error("Password reset error:", error.code);
        message.textContent =
          "Could not send the reset email. Please check the email and Firebase settings.";
      }
    });
  </script>
</body>
</html>
