
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 20px 0;
      display: flex; justify-content: center; align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#ff9a9e,#fad0c4,#a18cd1,#84fab0,#8fd3f4);
    }
    table {
      width: 420px; max-width: 94vw; background: white;
      border: 2px solid #333; border-collapse: collapse;
      box-shadow: 0 5px 15px #0004;
    }
    th { padding: 15px; color: white; background: #2c3e50; font-size: 22px; }
    td { padding: 10px; border: 1px solid #ddd; }
    td:first-child { width: 35%; }
    input {
      width: 100%; min-width: 0; padding: 11px 9px;
      border: 1px solid #aaa; border-radius: 4px; font-size: 16px;
    }
    button {
      padding: 12px 18px; border: none; border-radius: 5px;
      background: #2c3e50; color: white; font-size: 16px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    a { color: #174ea6; }
    #message { padding: 12px; text-align: center; overflow-wrap: anywhere; }
    @media(max-width:380px) { td { padding: 7px; } }
  </style>
</head>
<body>
<table>
  <tr><th colspan="2">Registration</th></tr>
  <tr>
    <td><label for="username">Username</label></td>
    <td><input id="username" type="text" autocomplete="username"
      placeholder="Enter username" maxlength="50" required></td>
  </tr>
  <tr>
    <td><label for="email">Email</label></td>
    <td><input id="email" type="email" autocomplete="email"
      placeholder="Enter email" required></td>
  </tr>
  <tr><td colspan="2" style="text-align:center">
    <button type="button" id="sendOtpBtn">Send OTP</button>
  </td></tr>
  <tr>
    <td><label for="otp">6-Digit OTP</label></td>
    <td><input id="otp" inputmode="numeric" autocomplete="one-time-code"
      placeholder="Enter OTP" maxlength="6" required></td>
  </tr>
  <tr>
    <td><label for="password">Password</label></td>
    <td><input id="password" type="password" autocomplete="new-password"
      placeholder="Create password" minlength="6" required></td>
  </tr>
  <tr>
    <td><label for="confirmPassword">Confirm Password</label></td>
    <td><input id="confirmPassword" type="password" autocomplete="new-password"
      placeholder="Confirm password" required></td>
  </tr>
  <tr><td colspan="2" style="text-align:center">
    <button type="button" id="registerBtn">Register</button>
  </td></tr>
  <tr><td colspan="2" style="text-align:center">
    Already have an account? <a href="index.html">Login here</a>
  </td></tr>
  <tr><td colspan="2" id="message" aria-live="polite"></td></tr>
</table>

<script type="module">
import emailjs from "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/+esm";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, updateProfile
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const EMAILJS_PUBLIC_KEY = "3DsW5p7HS1GzXOydE";
const SERVICE_ID = "service_1zheuj9";
const TEMPLATE_ID = "template_8xv3k2j";

emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

const firebaseConfig = {
  apiKey: "AIzaSyB_UIQf1nKgHDfOrdmJwJ3f4zUnr11MBCk",
  authDomain: "logpage-b5d48.firebaseapp.com",
  projectId: "logpage-b5d48",
  storageBucket: "logpage-b5d48.firebasestorage.app",
  messagingSenderId: "1036796191778",
  appId: "1:1036796191778:web:66dbb4aae131310e22167b",
  measurementId: "G-17VKE891SF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const otpInput = document.getElementById("otp");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");
const sendOtpBtn = document.getElementById("sendOtpBtn");
const registerBtn = document.getElementById("registerBtn");
const message = document.getElementById("message");

let generatedOtp = "";
let otpEmail = "";
let otpExpiry = 0;
let otpAttempts = 0;
let otpSending = false;
let registering = false;

function showMessage(text, color = "#222") {
  message.textContent = text;
  message.style.color = color;
}
function clearOtp() {
  generatedOtp = "";
  otpEmail = "";
  otpExpiry = 0;
  otpAttempts = 0;
  otpInput.value = "";
}

emailInput.addEventListener("input", () => {
  if (emailInput.value.trim().toLowerCase() !== otpEmail) {
    clearOtp();
  }
});

sendOtpBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim().toLowerCase();

  if (!email || !emailInput.checkValidity()) {
    showMessage("Please enter a valid email address.", "red");
    emailInput.focus();
    return;
  }
  if (otpSending || registering) return;

  otpSending = true;
  sendOtpBtn.disabled = true;
  clearOtp();

  // NOTE: This browser-generated OTP is for a basic demo only,
  // not secure email verification for a production application.
  const code = String(Math.floor(100000 + Math.random() * 900000));

  try {
    showMessage("Sending OTP...");
    await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
      to_email: email,
      passcode: code,
      time: "5 minutes"
    });
    generatedOtp = code;
    otpEmail = email;
    otpExpiry = Date.now() + 5 * 60 * 1000;
    showMessage("OTP sent. Check your inbox and spam folder.", "green");
  } catch (error) {
    console.error(error);
    showMessage("OTP email failed. Check EmailJS settings.", "red");
  } finally {
    otpSending = false;
    sendOtpBtn.disabled = false;
  }
});

registerBtn.addEventListener("click", async () => {
  if (registering) return;

  const username = usernameInput.value.trim();
  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;
  const confirmPassword = confirmInput.value;
  const enteredOtp = otpInput.value.trim();

  if (!username || username.length > 50) {
    showMessage("Enter a username (up to 50 characters).", "red");
    usernameInput.focus();
    return;
  }
  if (!email || !emailInput.checkValidity()) {
    showMessage("Enter a valid email address.", "red");
    emailInput.focus();
    return;
  }
  if (!generatedOtp || otpEmail !== email) {
    showMessage("Send a new OTP to this email first.", "red");
    return;
  }
  if (Date.now() > otpExpiry) {
    clearOtp();
    showMessage("OTP expired. Please request a new one.", "red");
    return;
  }
  if (otpAttempts >= 5) {
    clearOtp();
    showMessage("Too many attempts. Request a new OTP.", "red");
    return;
  }
  if (!/^[0-9]{6}$/.test(enteredOtp)) {
    showMessage("OTP must contain exactly 6 digits.", "red");
    return;
  }
  if (enteredOtp !== generatedOtp) {
    otpAttempts++;
    showMessage("Incorrect OTP. Attempts remaining: " + (5 - otpAttempts), "red");
    return;
  }
  if (password.length < 6) {
    showMessage("Password must be at least 6 characters.", "red");
    passwordInput.focus();
    return;
  }
  if (password !== confirmPassword) {
    showMessage("Passwords do not match.", "red");
    confirmInput.focus();
    return;
  }

  registering = true;
  registerBtn.disabled = true;
  sendOtpBtn.disabled = true;
  let createdUser = null;

  try {
    showMessage("Creating account...");
    const credential = await createUserWithEmailAndPassword(auth, email, password);
    createdUser = credential.user;

    await updateProfile(createdUser, { displayName: username });

    await setDoc(doc(db, "users", createdUser.uid), {
      username,
      email: createdUser.email,
      createdAt: serverTimestamp()
    });

    clearOtp();
    showMessage("Registration successful! You can now log in.", "green");
    setTimeout(() => { window.location.href = "index.html"; }, 1500);
  } catch (error) {
    console.error(error);
    const errors = {
      "auth/email-already-in-use": "This email is already registered. Please log in.",
      "auth/invalid-email": "Please enter a valid email.",
      "auth/weak-password": "Choose a stronger password.",
      "auth/too-many-requests": "Too many attempts. Try again later.",
      "auth/network-request-failed": "Network error. Check your internet.",
      "permission-denied": "Firestore permission denied. Do not make the database public."
    };
    if (createdUser) {
      showMessage("Auth account was created, but saving the profile failed. Check Firestore rules and Firebase Authentication before retrying.", "red");
    } else {
      showMessage(errors[error.code] || "Registration failed. " + (error.message || ""), "red");
    }
  } finally {
    registering = false;
    registerBtn.disabled = false;
    sendOtpBtn.disabled = false;
  }
});
</script>
</body>
</html>
