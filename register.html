
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - LogPage</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #e9d5ff, #fce7f3);
    }

    .register-box {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      color: #4338ca;
      margin-top: 0;
    }

    p {
      text-align: center;
      color: #555;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    a {
      color: #4338ca;
    }

    .links {
      text-align: center;
      margin-top: 18px;
      line-height: 2;
    }

    #message {
      margin-top: 15px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="register-box">
    <h1>Create Account</h1>
    <p>Register for LogPage</p>

    <form id="registerForm">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        autocomplete="username"
        maxlength="50"
        required
      >

      <label for="email">Email / Gmail</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="At least 6 characters"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter password again"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button type="submit" id="registerButton">
        Create Account
      </button>
    </form>

    <div class="links">
      Already have an account?
      <a href="index.html">Login here</a>
    </div>

    <p id="message" role="status" aria-live="polite"></p>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      sendEmailVerification,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_UIQf1nKgHDfOrdmJwJ3f4zUnr11MBCk",
      authDomain: "logpage-b5d48.firebaseapp.com",
      projectId: "logpage-b5d48",
      storageBucket: "logpage-b5d48.firebasestorage.app",
      messagingSenderId: "1036796191778",
      appId: "1:1036796191778:web:66dbb4aae131310e22167b",
      measurementId: "G-17VKE891SF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const registerForm = document.getElementById("registerForm");
    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput =
      document.getElementById("confirmPassword");
    const registerButton = document.getElementById("registerButton");
    const message = document.getElementById("message");

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!username) {
        message.textContent = "Please enter a username.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      registerButton.disabled = true;
      message.textContent = "Creating your account...";
      message.style.color = "#555";

      let user = null;

      try {
        // Step 1: Create the Firebase Authentication account.
        const credential = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        user = credential.user;

        // Step 2: Save the user's profile in Firestore.
        await setDoc(doc(db, "users", user.uid), {
          username: username,
          email: user.email,
          createdAt: serverTimestamp()
        });

        // Step 3: Send email verification link.
        await sendEmailVerification(user);

        // Step 4: Sign out until the email is verified.
        await signOut(auth);

        message.style.color = "#15803d";
        message.textContent =
          "Account created! A verification link has been sent to your email. Verify it, then log in.";

        registerForm.reset();

      } catch (error) {
        console.error(error);

        if (user) {
          // Account creation may have succeeded even if a later
          // step failed. Keep the account; do not delete it.
          try {
            await signOut(auth);
          } catch (signOutError) {
            console.error(signOutError);
          }

          if (error.code === "auth/too-many-requests") {
            message.textContent =
              "Too many requests. Please try again later.";
          } else {
            message.textContent =
              "Your account may have been created, but a later step failed. " +
              "Check Firebase Authentication and Firestore before registering again.";
          }
        } else if (error.code === "auth/email-already-in-use") {
          message.textContent =
            "This email is already registered. Please log in instead.";
        } else if (error.code === "auth/invalid-email") {
          message.textContent = "Please enter a valid email address.";
        } else if (error.code === "auth/weak-password") {
          message.textContent =
            "Please choose a stronger password with at least 6 characters.";
        } else {
          message.textContent =
            "Registration failed: " + error.message;
        }
      } finally {
        registerButton.disabled = false;
      }
    });
  </script>
</body>
</html>
