
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration - GLA University</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-image:
        url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='90'><text x='15' y='55' font-family='Arial' font-size='14' font-weight='bold' fill='white' fill-opacity='0.6' transform='rotate(-20 85 45)'>GLA University</text></svg>"),
        linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1, #84fab0, #8fd3f4);
      background-repeat: repeat, no-repeat;
      background-size: auto, cover;
      background-attachment: fixed;
    }

    table {
      width: 380px;
      max-width: 94vw;
      background: white;
      border: 2px solid #333;
      border-collapse: collapse;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
    }

    th {
      padding: 15px;
      color: white;
      background: #2c3e50;
      font-size: 22px;
    }

    td {
      padding: 10px;
      border: 1px solid #ddd;
    }

    td:first-child {
      width: 35%;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 9px;
      border: 1px solid #aaa;
      border-radius: 4px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      background: #2c3e50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1a252f;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    a {
      color: #174ea6;
    }

    #message {
      padding: 10px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    @media (max-width: 380px) {
      td {
        padding: 7px;
      }
    }
  </style>
</head>

<body>
  <table>
    <tr>
      <th colspan="2">Registration</th>
    </tr>

    <tr>
      <td><label for="username">Username</label></td>
      <td>
        <input type="text" id="username"
               autocomplete="username"
               placeholder="Enter username"
               minlength="3" maxlength="30" required>
      </td>
    </tr>

    <tr>
      <td><label for="email">Email</label></td>
      <td>
        <input type="email" id="email"
               autocomplete="email"
               placeholder="Enter email" required>
      </td>
    </tr>

    <tr>
      <td><label for="password">Password</label></td>
      <td>
        <input type="password" id="password"
               autocomplete="new-password"
               placeholder="Create password"
               minlength="6" required>
      </td>
    </tr>

    <tr>
      <td><label for="confirmPassword">Confirm Password</label></td>
      <td>
        <input type="password" id="confirmPassword"
               autocomplete="new-password"
               placeholder="Confirm password" required>
      </td>
    </tr>

    <tr>
      <td colspan="2" style="text-align:center">
        <button type="button" id="registerBtn">Register</button>
      </td>
    </tr>

    <tr>
      <td colspan="2" style="text-align:center">
        Already have an account?
        <a href="index.html">Login here</a>
      </td>
    </tr>

    <tr>
      <td colspan="2" id="message" aria-live="polite"></td>
    </tr>
  </table>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      sendEmailVerification,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_UIQf1nKgHDfOrdmJwJ3f4zUnr11MBCk",
      authDomain: "logpage-b5d48.firebaseapp.com",
      projectId: "logpage-b5d48",
      storageBucket: "logpage-b5d48.firebasestorage.app",
      messagingSenderId: "1036796191778",
      appId: "1:1036796191778:web:66dbb4aae131310e22167b",
      measurementId: "G-17VKE891SF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const registerBtn = document.getElementById("registerBtn");
    const message = document.getElementById("message");

    function showMessage(text, color = "#222") {
      message.textContent = text;
      message.style.color = color;
    }

    registerBtn.addEventListener("click", async () => {
      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (!/^[a-zA-Z0-9_]{3,30}$/.test(username)) {
        showMessage(
          "Username must be 3-30 characters and contain only letters, numbers, or underscores.",
          "red"
        );
        return;
      }

      if (!email || !password || !confirmPassword) {
        showMessage("Please fill in all fields.", "red");
        return;
      }

      if (password.length < 6) {
        showMessage("Password must contain at least 6 characters.", "red");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.", "red");
        return;
      }

      registerBtn.disabled = true;
      showMessage("Creating your account...");

      let createdUser = null;

      try {
        const credential = await createUserWithEmailAndPassword(
          auth, email, password
        );

        createdUser = credential.user;

        await setDoc(doc(db, "users", createdUser.uid), {
          username: username,
          email: createdUser.email,
          createdAt: serverTimestamp()
        });
try {
  await sendEmailVerification(createdUser);

  showMessage(
    "Registration successful! Verification email sent. Check your Gmail and Spam folder.",
    "green"
  );
} catch (emailError) {
  showMessage(
    "Account created, but verification email failed: " +
      emailError.code + " - " + emailError.message,
    "red"
  );
}

await signOut(auth);
       
        passwordInput.value = "";
        confirmInput.value = "";

      } catch (error) {
        const messages = {
          "auth/email-already-in-use": "This email is already registered. Please log in instead.",
          "auth/invalid-email": "Please enter a valid email address.",
          "auth/weak-password": "Please choose a stronger password.",
          "auth/too-many-requests": "Too many attempts. Please try again later.",
          "auth/network-request-failed": "Network error. Check your internet connection.",
          "permission-denied": "Firestore permission denied. Please check your Firestore rules."
        };

        showMessage(
          messages[error.code] ||
          (error.code === "permission-denied"
            ? messages["permission-denied"]
            : "Registration could not be completed: " + error.message),
          "red"
        );

        // If account creation succeeded but a later step failed,
        // do not try to create the same account again automatically.
        if (createdUser) {
          try {
            await signOut(auth);
          } catch (_) {}
        }
      } finally {
        registerBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
